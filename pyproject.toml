[project]
name = "nano-agents"
version = "0.1.0"
description = "Agentic AI from scratch, with a Bayesian lens."
authors = [{ name = "Ba-Hien Tran", email = "bahientranvn@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://tranbahien.github.io/nano-agents"
Repository = "https://github.com/tranbahien/nano-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_agents"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
